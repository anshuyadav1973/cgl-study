services:
  - type: web
    name: ssc-cgl-testbook-portal
    runtime: python
    buildCommand: ""
    startCommand: "python3 app/server.py"
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
